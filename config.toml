baseURL = "https://pastyapp.org/"
locale = "en-us"
title = "Pasty Cloud Clipboard"
disableKinds = ["taxonomy", "term"]

# HTML minify would decode the encoded imprint email (layouts/shortcodes/email.html)
[minify]
  disableHTML = true

[menu]
  [[menu.main]]
    name = "About Pasty"
    pre = "home"
    pageRef = "/"
    weight = 1
  [[menu.main]]
    name = "F.A.Q."
    pre = "help-circle"
    pageRef = "/faq"
    weight = 3
  [[menu.main]]
    name = "Login"
    pre = "log-in"
    url = "https://pasty.cc"
    weight = 4

[params]
  description = "Pasty is a free cloud clipboard: copy a link or text on one device and paste it on another. Android app and web app, no ads, your data stays yours."
